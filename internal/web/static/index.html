<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語 · Japan learner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></symbol>
    <symbol id="i-kata" viewBox="0 0 24 24"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2"/><polyline points="2 15.5 12 22 22 15.5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-esc" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none">esc</text></symbol>
    <symbol id="i-bs" viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M6 14h0M18 14h0M9.5 14h5"/></symbol>
  </defs>
</svg>

<div class="bg-decor" aria-hidden="true">あ kana か な KA タ カ ナ</div>

<header class="topbar">
  <div class="brand">
    <span class="logo">日</span>
    <div>
      <h1>Japan&nbsp;learner</h1>
      <p>фразы · хирагана · катакана</p>
    </div>
  </div>
  <div id="status" class="chip chip-connecting"><span class="dot"></span><span class="chip-text">подключение…</span></div>
</header>

<main class="layout">
  <section class="stage-card">
    <div class="stage-head">
      <h2 id="view-title">Главное меню</h2>
      <div class="keystrokes" id="keystrokes" title="Последние отправленные клавиши"></div>
    </div>
    <div class="screen-wrap">
      <section id="screen" aria-live="polite">
        <div id="display"><pre>Загрузка…</pre></div>
      </section>
      <div class="screen-fade" aria-hidden="true"></div>
    </div>
    <footer class="composer">
      <input id="line" type="text" autocomplete="off" placeholder="Введите ответ ромадзи и нажмите Enter…" spellcheck="false">
      <button id="enterBtn" class="btn btn-primary icon-btn" title="Отправить (Enter)"><svg class="icon"><use href="#i-enter"/></svg></button>
    </footer>
  </section>

  <aside class="side">
    <nav class="panel">
      <h2 class="panel-title">Меню</h2>
      <button class="menu-btn" data-key="1"><kbd>1</kbd><svg class="icon accent-phrases"><use href="#i-book"/></svg><span class="label">Фразы</span></button>
      <button class="menu-btn" data-key="2"><kbd>2</kbd><svg class="icon accent-hiragana"><use href="#i-pencil"/></svg><span class="label">Хирагана</span></button>
      <button class="menu-btn" data-key="3"><kbd>3</kbd><svg class="icon accent-katakana"><use href="#i-type"/></svg><span class="label">Катакана</span></button>
      <div class="divider"></div>
      <button class="menu-btn subtle" data-key="4"><kbd>4</kbd><svg class="icon"><use href="#i-reset"/></svg><span class="label">Сброс хираганы</span></button>
      <button class="menu-btn subtle" data-key="5"><kbd>5</kbd><svg class="icon"><use href="#i-reset"/></svg><span class="label">Сброс катаканы</span></button>
      <button class="menu-btn subtle" data-key="6"><kbd>6</kbd><svg class="icon"><use href="#i-reset"/></svg><span class="label">Сброс фраз</span></button>
      <button class="menu-btn danger" data-key="0"><kbd>0</kbd><svg class="icon"><use href="#i-power"/></svg><span class="label">Выход</span></button>
    </nav>

    <nav class="panel">
      <h2 class="panel-title">Быстрый ответ</h2>
      <button class="menu-btn ok" data-key="1"><kbd>1</kbd><svg class="icon"><use href="#i-check"/></svg><span class="label">Могу перевести</span></button>
      <button class="menu-btn info" data-key="2"><kbd>2</kbd><svg class="icon"><use href="#i-eye"/></svg><span class="label">Показать перевод</span></button>
      <button class="menu-btn warn" data-key="3"><kbd>3</kbd><svg class="icon"><use href="#i-x"/></svg><span class="label">Не могу перевести</span></button>
      <button class="menu-btn subtle" data-key="4"><kbd>4</kbd><svg class="icon"><use href="#i-home"/></svg><span class="label">В главное меню</span></button>
    </nav>

    <section class="panel">
      <h2 class="panel-title">Клавиши</h2>
      <div class="row">
        <button id="escBtn" class="key-btn" title="Esc — назад / статистика"><svg class="icon"><use href="#i-esc"/></svg><span>Esc</span></button>
        <button id="bsBtn" class="key-btn" title="Удалить символ"><svg class="icon"><use href="#i-bs"/></svg><span>⌫</span></button>
      </div>
      <p class="hint"><svg class="icon tiny"><use href="#i-key"/></svg> Можно печатать прямо на странице — клавиши уходят на сервер, как в терминале.</p>
    </section>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
